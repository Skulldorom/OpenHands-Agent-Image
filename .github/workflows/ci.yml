name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Release increment (auto uses commit directives)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
permissions:
  contents: read
jobs:
  release:
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      bump: ${{ inputs.bump || 'auto' }}
