name: Policy proposal review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  policy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Syntax, ShellCheck and policy tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
          shellcheck scripts/*.sh tests/*.sh
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 -m py_compile scripts/*.py tests/*.py
          python3 tests/test-init-local.py
          python3 tests/test-security-assessment.py
          python3 tests/test-blocker-explain.py
          python3 tests/test-release-evidence.py
          python3 tests/test-release-planning.py
          python3 tests/test-planner-execution.py
          python3 tests/hosted-publication.py --self-test
          python3 tests/test-publication.py
          python3 tests/test-immutable-assets.py
          python3 tests/test-layer-security.py
          python3 tests/test-inventory-grouping.py
          python3 tests/test-provenance.py
          python3 tests/test-automation-safety.py
          python3 tests/test-workflow-policy.py
      - name: Reassess retained exact-artifact evidence without building or publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EVIDENCE_RUN=$(jq -r .run_id security/historical-evidence.json)
          EVIDENCE_ATTEMPT=$(jq -r .attempt security/historical-evidence.json)
          CANDIDATE_DIGEST=$(jq -r '.candidate | split("@")[1]' security/historical-evidence.json)
          export EVIDENCE_RUN EVIDENCE_ATTEMPT CANDIDATE_DIGEST
          python3 scripts/evidence.py historical /tmp/historical
          python3 tests/test-proposed-evidence.py /tmp/historical/evidence.zip | tee proposal-validation.json
          echo 'Proposal only: active policy still blocks publication. No approval granted.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve full reassessments
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inactive-policy-review
          path: |
            active-policy.json
            active-policy.md
            proposal-validation.json
  integration:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build local validation image only
        run: docker build --tag local-pr-validation .
      - name: Real Git PostgreSQL API and signals
        run: scripts/validate-image.sh local-pr-validation
      - name: Inspect layers for credentials
        run: |
          upstream=$(sed -n 's/^ARG UPSTREAM_IMAGE=//p' Dockerfile)
          docker pull "$upstream"
          python3 - "$upstream" <<'PYCODE'
          import json
          import subprocess
          import sys
          def inspect(ref):
              return json.loads(subprocess.check_output(["docker", "inspect", ref]))[0]["RootFS"]["Layers"]
          base = inspect(sys.argv[1])
          candidate = inspect("local-pr-validation")
          assert candidate[:len(base)] == base, "Candidate base layers differ"
          print("Upstream diff IDs: " + json.dumps(base))
          print(f"Verified upstream layer prefix: {len(base)} of {len(candidate)} layers; exact upstream prefix verified")
          PYCODE
          timeout 15m python3 tests/test-image-layers.py "$upstream"
          timeout 15m python3 tests/test-image-layers.py local-pr-validation
