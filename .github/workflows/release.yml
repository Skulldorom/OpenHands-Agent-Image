name: Build and validate candidate
on:
  workflow_call:
    inputs:
      bump:
        type: string
        default: auto
permissions:
  contents: read
concurrency:
  group: ghcr-main-release
  cancel-in-progress: false
jobs:
  build-test-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/skulldorom/openhands-agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Shell syntax, ShellCheck, and Python syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
          shellcheck scripts/*.sh tests/*.sh
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 -m py_compile scripts/*.py tests/*.py
          python3 tests/test-init-local.py
          python3 tests/test-security-assessment.py
          python3 tests/test-blocker-explain.py
          python3 tests/test-release-evidence.py
          python3 tests/test-release-planning.py
          python3 tests/test-provenance.py
          python3 tests/test-workflow-policy.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Inspect upstream contract and plan version
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
        run: python3 scripts/release.py plan
      - name: Skip unchanged image
        if: steps.plan.outputs.build != 'true'
        env:
          BLOCKED: ${{ steps.plan.outputs.blocked }}
        run: |
          if [ -n "$BLOCKED" ]; then
            echo "BLOCKED — AWAITING UPSTREAM FIX. Reusing evidence: $BLOCKED; no rebuild or release." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'Upstream and build inputs unchanged; no release.' >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.plan.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Dockerfile checks
        if: steps.plan.outputs.build == 'true'
        env:
          UPSTREAM: ${{ steps.plan.outputs.upstream }}
        run: docker buildx build --check --build-arg UPSTREAM_IMAGE="ghcr.io/openhands/agent-server@$UPSTREAM" .
      - name: Build candidate once with SBOM and provenance
        id: build
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/skulldorom/openhands-agent:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
          sbom: true
          build-args: |
            UPSTREAM_IMAGE=ghcr.io/openhands/agent-server@${{ steps.plan.outputs.upstream }}
            UPSTREAM_DIGEST=${{ steps.plan.outputs.upstream }}
            VERSION=${{ steps.plan.outputs.version }}
            REVISION=${{ github.sha }}
      - name: Attest image build
        if: steps.plan.outputs.build == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/skulldorom/openhands-agent
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Pull exact artifact and validate metadata
        if: steps.plan.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          UPSTREAM: ${{ steps.plan.outputs.upstream }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' "$IMAGE@$DIGEST")" = "$UPSTREAM"
          test "$(docker inspect -f '{{.Config.User}}' "$IMAGE@$DIGEST")" = openhands
          test "$(docker inspect -f '{{.Architecture}}' "$IMAGE@$DIGEST")" = amd64
      - name: Git, PostgreSQL 17, Agent Server API, and signals
        if: steps.plan.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          scripts/validate-image.sh "$IMAGE@$DIGEST"
          echo '## Functional validation: PASS (Git commits, PostgreSQL backup/restore, API, entrypoint and signals, metadata)' >> "$GITHUB_STEP_SUMMARY"
      - name: Layer security and package inventory
        if: steps.plan.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          timeout 15m python3 tests/test-image-layers.py "$IMAGE@$DIGEST"
          docker run --rm "$IMAGE@$DIGEST" --exec bash -c '
            cat /etc/apt/sources.list.d/debian.sources
            dpkg-query -W
            for file in /usr/bin/gh /usr/bin/rootlesskit /usr/libexec/docker/cli-plugins/docker-{buildx,compose}; do
              dpkg-query -S "$file"
            done
            apt-cache policy libpq5 postgresql-17 postgresql-client-17 linux-libc-dev gh docker-ce-rootless-extras docker-buildx-plugin docker-compose-plugin
          ' > package-inventory.txt
      - name: Record complete functional evidence
        if: steps.plan.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 scripts/evidence.py record "$DIGEST"
      - name: Attest functional evidence
        if: steps.plan.outputs.build == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: functional-pass.json
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        if: steps.plan.outputs.build == 'true'
        with:
          version: v0.69.3
          cache: true
      - name: Freeze scanner database
        if: steps.plan.outputs.build == 'true'
        run: |
          trivy image --cache-dir .cache/trivy --download-db-only
          sha256sum .cache/trivy/db/trivy.db | tee scanner-database.sha256
          trivy version --format json > scanner-version.json
      - name: Complete unsuppressed candidate inventory
        if: steps.plan.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          trivy image --cache-dir .cache/trivy --skip-db-update --skip-java-db-update \
            --scanners vuln,secret --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignorefile /dev/null --ignore-unfixed=false --list-all-pkgs --format json --output trivy.json \
            --timeout 15m "$IMAGE@$DIGEST"
      - name: Scan exact upstream with the same Trivy database
        if: steps.plan.outputs.build == 'true'
        env:
          UPSTREAM: ${{ steps.plan.outputs.upstream }}
        run: |
          trivy image --cache-dir .cache/trivy --skip-db-update --skip-java-db-update \
            --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --ignorefile /dev/null --ignore-unfixed=false \
            --list-all-pkgs --format json --output upstream-trivy.json --timeout 15m \
            "ghcr.io/openhands/agent-server@$UPSTREAM"
          curl --fail --show-error --silent --retry 3 --max-time 120 \
            https://security-tracker.debian.org/tracker/data/json > debian-tracker.json
          sha256sum --check scanner-database.sha256
      - name: Full security assessment (no suppressions)
        if: steps.plan.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          UPSTREAM: ${{ steps.plan.outputs.upstream }}
        run: |
          python3 scripts/security-assessment.py --candidate trivy.json --upstream upstream-trivy.json \
            --policy security/policy.json --tracker debian-tracker.json \
            --candidate-ref "$IMAGE@$DIGEST" --upstream-ref "ghcr.io/openhands/agent-server@$UPSTREAM" --report-only
          python3 -c 'import json,os; d=json.load(open("security-assessment.json")); f=open(os.environ["GITHUB_STEP_SUMMARY"],"a"); f.write("\n## Modification security: " + ("PASS" if d["modification_pass"] else "FAIL") + "\nIntroduced HIGH/CRITICAL: " + str(len(d["introduced_high_critical"])) + "; detected secrets: " + str(len(d["secrets"])) + "\nInherited and other origins: " + str(d["origin_counts"]) + "\n")'
      - name: Modification security gate (introduced HIGH/CRITICAL and all secrets)
        if: steps.plan.outputs.build == 'true'
        run: |
          python3 -c 'import json; assert json.load(open("security-assessment.json"))["modification_pass"], "Introduced risk or secrets detected"'
      - name: Strict release policy and owner approval
        if: "!cancelled() && steps.plan.outputs.build == 'true' && hashFiles('security-assessment.json') != ''"
        run: |
          python3 -c 'import json,os; d=json.load(open("security-assessment.json")); p=json.load(open("security/policy.json")); open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("\n## Release eligibility: " + ("PASS" if d["pass"] and p["release_approved"] else "BLOCKED") + "; strict policy blockers: " + str(len(d["blockers"])) + "; owner approval: " + str(p["release_approved"]) + "\n"); assert d["pass"] and p["release_approved"], "Release policy or owner approval blocks publication"'
      - name: Explain blockers and remediation verdicts
        if: failure()
        continue-on-error: true
        run: |
          python3 scripts/explain-blockers.py --gate security-gate.json --summary | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 90
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            functional-pass.json
            state.json
            trivy.json
            package-inventory.txt
            upstream-trivy.json
            scanner-version.json
            scanner-database.sha256
            debian-tracker.json
            security-assessment.json
            security-assessment.md
            security-gate.json
            security-blockers.md
          if-no-files-found: ignore
      - name: Failure summary
        if: failure()
        run: echo 'Validation failed. No latest promotion occurred. Inspect job logs; existing releases are preserved.' >> "$GITHUB_STEP_SUMMARY"
