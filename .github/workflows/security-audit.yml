name: Exact candidate security audit
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.69.3
          cache: false
      - name: Scan exact historical candidate and its actual base
        shell: bash
        run: |
          candidate=$(jq -r .candidate security/historical-evidence.json)
          docker pull "$candidate"
          upstream=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' "$candidate")
          [[ "$upstream" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "$upstream" > upstream-digest.txt
          trivy image --cache-dir .cache/trivy --download-db-only
          sha256sum .cache/trivy/db/trivy.db > scanner-database.sha256
          tar -czf scanner-database.tar.gz -C .cache/trivy db
          trivy version --format json > scanner-version.json
          for target in candidate upstream; do
            ref="$candidate"
            if [[ "$target" == upstream ]]; then ref="ghcr.io/openhands/agent-server@$upstream"; fi
            trivy image --cache-dir .cache/trivy --skip-db-update --skip-java-db-update \
              --scanners vuln,secret --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --ignorefile /dev/null --ignore-unfixed=false --list-all-pkgs \
              --format json --output "$target-trivy.json" --timeout 20m "$ref"
          done
          sha256sum --check scanner-database.sha256
          curl --fail --silent --show-error --retry 3 --max-time 120 \
            https://security-tracker.debian.org/tracker/data/json > debian-tracker.json
          python3 scripts/security-assessment.py --candidate candidate-trivy.json --upstream upstream-trivy.json \
            --policy security/policy.json --tracker debian-tracker.json --candidate-ref "$candidate" \
            --upstream-ref "ghcr.io/openhands/agent-server@$upstream" --report-only
      - name: Group all HIGH and CRITICAL instances without suppressing findings
        run: python3 scripts/group-security-inventory.py security-assessment.json
      - name: Inspect compiled Go reachability without executing candidate tools
        shell: bash
        run: |
          go version > go-inspection-toolchain.txt
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck="$(go env GOPATH)/bin/govulncheck"
          "$govulncheck" -version > govulncheck-version.txt
          candidate=$(jq -r .candidate security/historical-evidence.json)
          cid=$(docker create "$candidate")
          trap 'docker rm "$cid" >/dev/null' EXIT
          mkdir -p reachability
          for path in usr/bin/gh usr/bin/rootlesskit usr/libexec/docker/cli-plugins/docker-buildx usr/libexec/docker/cli-plugins/docker-compose; do
            name=${path##*/}
            docker cp "$cid:/$path" "reachability/$name"
            sha256sum "reachability/$name" > "reachability/$name.sha256"
            go version -m "reachability/$name" > "reachability/$name.modules.txt"
            status=0
            "$govulncheck" -mode=binary -json "reachability/$name" > "reachability/$name.govulncheck.json" 2> "reachability/$name.govulncheck.stderr" || status=$?
            printf '%s\n' "$status" > "reachability/$name.exit-code"
            [[ "$status" == 0 || "$status" == 3 ]]
            rm "reachability/$name"
          done
      - name: Record OS package and XML consumer reachability in isolated container
        shell: bash
        run: |
          candidate=$(jq -r .candidate security/historical-evidence.json)
          docker run --rm -i --read-only --network none --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /bin/sh "$candidate" -s > os-reachability.txt <<'SH'
          set -eu
          dpkg-query -W libxml2 linux-libc-dev chromium
          dpkg-query -L linux-libc-dev
          ldd /usr/lib/chromium/chromium
          if command -v dockerd; then printf '%s\n' 'A daemon binary exists; review required'; fi
          SH
      - name: Inspect newly released Compose vendor artifact without running it
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 120 \
            https://github.com/docker/compose/releases/download/v5.7.2/docker-compose-linux-x86_64 \
            --output /tmp/vendor-compose-5.7.2
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          raw = Path("/tmp/vendor-compose-5.7.2").read_bytes()
          expected = "e14235d9c622c5bd57eb8adeed4a0f7308c7f3862e6812dd843f6fe27f1307cc"
          actual = hashlib.sha256(raw).hexdigest()
          report = {"release": "v5.7.2", "expected_sha256": expected, "download_sha256": actual,
                    "download_size": len(raw), "verified": bool(raw) and actual == expected,
                    "source": "GitHub official release asset metadata"}
          Path("reachability/vendor-compose-5.7.2-verification.json").write_text(json.dumps(report, indent=2) + "\n")
          assert report["verified"], "Vendor binary integrity check failed; module inspection is blocked"
          PY
          go version -m /tmp/vendor-compose-5.7.2 > reachability/vendor-compose-5.7.2.modules.txt
          rm /tmp/vendor-compose-5.7.2
      - name: Preserve unsuppressed audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-candidate-security-${{ github.run_id }}
          retention-days: 90
          path: |
            os-reachability.txt
            go-inspection-toolchain.txt
            govulncheck-version.txt
            reachability/
            high-critical-inventory.json
            high-critical-inventory.md
            candidate-trivy.json
            upstream-trivy.json
            upstream-digest.txt
            scanner-version.json
            scanner-database.sha256
            scanner-database.tar.gz
            debian-tracker.json
            security-assessment.json
            security-assessment.md

      - name: Retain compact reachability and inventory review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reachability-review-${{ github.run_id }}
          retention-days: 90
          path: |
            os-reachability.txt
            go-inspection-toolchain.txt
            govulncheck-version.txt
            reachability/
            high-critical-inventory.json
            high-critical-inventory.md
