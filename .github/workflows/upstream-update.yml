name: Daily upstream update
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      bump:
        description: Release increment; dispatch still requires every security gate
        type: choice
        options: [auto, patch, minor, major]
        default: auto
permissions:
  contents: read
jobs:
  release:
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      bump: ${{ inputs.bump || 'auto' }}
